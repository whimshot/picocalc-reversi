name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build:
    name: Build for ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico
            platform: rp2040
          - board: pico_w
            platform: rp2040
          - board: pico2
            platform: rp2350
          - board: pico2_w
            platform: rp2350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Toolchain & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential libstdc++-arm-none-eabi-newlib

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          path: pico-sdk
          ref: master # Or pin to a specific version like '2.0.0' or '2.1.0'
          submodules: recursive

      - name: Configure and Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          mkdir build
          cd build
          cmake -DPICO_BOARD=${{ matrix.board }} -DPICO_PLATFORM=${{ matrix.platform }} ..
          make -j$(nproc)

      - name: Prepare Release Artifacts
        run: |
          mkdir -p artifacts
          # Rename the .uf2 file to include the board name so they don't overwrite each other
          for file in build/*.uf2; do
            base=$(basename "$file" .uf2)
            cp "$file" "artifacts/${base}-${{ matrix.board }}.uf2"
          done

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: artifacts/*.uf2

  release:
    name: Create GitHub Release
    needs: build # Waits for all matrix builds to finish
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true # Puts all .uf2 files into one flat folder

      - name: Create Release and Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.uf2
          generate_release_notes: true
